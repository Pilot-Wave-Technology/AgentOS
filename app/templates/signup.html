<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up: Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body class="h-full flex items-center justify-center bg-gray-950 text-gray-100">

<div class="w-full max-w-sm px-8 py-10 bg-gray-900 rounded-2xl shadow-2xl border border-gray-800">
  <div class="text-center mb-8">
    <span class="text-4xl">⬡</span>
    <h1 class="text-2xl font-bold mt-2">Request Access</h1>
    <p class="text-gray-400 text-sm mt-1">Multi-Agent Coordination System</p>
  </div>

  <div id="error-msg" class="hidden mb-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-red-300 text-sm"></div>

  <!-- Phase 1: Firebase auth -->
  <div id="phase-auth">
    <button id="btn-google"
      class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-white hover:bg-gray-100 text-gray-900 rounded-lg font-medium transition-colors mb-4">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign up with Google
    </button>

    <div class="relative my-4">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-700"></div>
      </div>
      <div class="relative flex justify-center text-xs text-gray-500">
        <span class="bg-gray-900 px-2">or create account with email</span>
      </div>
    </div>

    <form id="form-email" class="space-y-3">
      <input id="full_name" type="text" placeholder="Full name" required
        class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-500" />
      <input id="email" type="email" placeholder="Email" required
        class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-500" />
      <input id="password" type="password" placeholder="Password (min 6 characters)" required minlength="6"
        class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-500" />
      <button type="submit"
        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-medium text-sm transition-colors">
        Create account
      </button>
    </form>
  </div>

  <!-- Phase 2: Role request (shown after auth) -->
  <div id="phase-role" class="hidden">
    <div class="mb-4 p-3 bg-green-900/30 border border-green-800 rounded-lg text-green-300 text-sm">
      Account created. Now tell us about yourself.
    </div>

    <form id="form-request" action="/signup/request" method="post" class="space-y-4">
      <input type="hidden" name="id_token" id="id_token_input" />

      <div>
        <label class="block text-xs text-gray-400 mb-1">Requested Role</label>
        <select name="requested_role"
          class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
          <option value="member">Goal Member: chat with agents, run tasks in assigned goals</option>
          <option value="editor">Goal Editor: create goals, add agents, manage everything in a goal</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Message to admin (optional)</label>
        <textarea name="message" rows="3" placeholder="Why do you need access? What's your role?"
          class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 resize-none placeholder-gray-500"></textarea>
      </div>

      <button type="submit"
        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-medium text-sm transition-colors">
        Submit request
      </button>
    </form>
  </div>

  <p class="text-center text-xs text-gray-500 mt-6">
    Already have an account? <a href="/login" class="text-indigo-400 hover:text-indigo-300">Sign in</a>
  </p>
</div>

<script>
  const firebaseConfig = {
    apiKey: "{{ firebase_api_key }}",
    projectId: "{{ firebase_project_id }}",
    authDomain: "{{ firebase_project_id }}.firebaseapp.com",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  {% if firebase_auth_emulator_host %}
  // LOCAL_SERVER on — route auth to the local Firebase Auth Emulator.
  auth.useEmulator("http://{{ firebase_auth_emulator_host }}");
  // The Firebase SDK auto-injects a fixed "Running in emulator mode..." banner
  // with no public API to disable it; hide it via its documented class name.
  document.head.insertAdjacentHTML('beforeend',
    '<style>.firebase-emulator-warning{display:none!important}</style>');
  {% endif %}

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  async function showRolePhase(userCredential) {
    // Get fresh token
    const token = await userCredential.user.getIdToken(true);
    document.getElementById('id_token_input').value = token;
    document.getElementById('phase-auth').classList.add('hidden');
    document.getElementById('phase-role').classList.remove('hidden');
    document.getElementById('error-msg').classList.add('hidden');
  }

  // Refresh token just before form submit to avoid expiry
  document.getElementById('form-request').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    if (user) {
      const freshToken = await user.getIdToken(true);
      document.getElementById('id_token_input').value = freshToken;
    }
    e.target.submit();
  });

  document.getElementById('btn-google').addEventListener('click', async () => {
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const cred = await auth.signInWithPopup(provider);
      await showRolePhase(cred);
    } catch (e) {
      showError(e.message);
    }
  });

  document.getElementById('form-email').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('full_name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      // Firebase ID tokens only carry a "name" claim if the account's profile has a
      // displayName set - Google sign-in gets this for free from the OAuth profile,
      // email/password accounts don't unless we set it explicitly here.
      await cred.user.updateProfile({ displayName: fullName });
      await showRolePhase(cred);
    } catch (e) {
      // If account already exists, try signing in instead
      if (e.code === 'auth/email-already-in-use') {
        try {
          const cred = await auth.signInWithEmailAndPassword(email, password);
          await showRolePhase(cred);
        } catch (e2) {
          showError(e2.message);
        }
      } else {
        showError(e.message);
      }
    }
  });
</script>
</body>
</html>
