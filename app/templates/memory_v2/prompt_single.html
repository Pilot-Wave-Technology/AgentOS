{% extends "base.html" %}
{% block title %}{{ agent_type }}: {{ prompt_kind }}{% endblock %}
{% block content %}
<div class="p-6 lg:p-8 max-w-4xl mx-auto">
  <div class="mb-4">
    <a href="/settings/memory/prompts" class="inline-flex items-center gap-1 text-xs text-gray-500 hover:text-brand-light">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Memory prompts
    </a>
  </div>
  <div class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-xl font-semibold text-gray-100">{{ agent_type }} · {{ prompt_kind }}</h1>
      <p class="text-sm text-gray-500 mt-0.5">Currently active version</p>
    </div>
    {% if is_admin %}
    <a href="/settings/memory/prompts/{{ agent_type }}/{{ prompt_kind }}" class="btn btn-secondary btn-sm">Edit</a>
    {% endif %}
  </div>

  <div class="card p-5">
    <pre class="text-xs text-gray-200 font-mono whitespace-pre-wrap">{{ content }}</pre>
  </div>
</div>
{% endblock %}
