{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block unauth_content %}
<div class="flex items-center justify-center h-screen">
  <div class="text-center">
    <div class="text-6xl font-bold text-gray-700">{{ code }}</div>
    <p class="mt-4 text-gray-400">{{ message }}</p>
    <div class="mt-6 flex items-center justify-center gap-3">
      <button type="button" onclick="history.length > 1 ? history.back() : (window.location.href = '/goals')"
        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm transition-colors">
        ← Go back
      </button>
      <a href="/goals" class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200 transition-colors">
        Go to Goals
      </a>
    </div>
  </div>
</div>
{% endblock unauth_content %}
