{% extends "base.html" %}
{% block title %}{{ template.name }}: Template{% endblock %}
{% block content %}
<div class="p-6 lg:p-8 max-w-4xl mx-auto">
  <div class="mb-6">
    <a href="/admin/assistant-templates" class="text-2xs text-gray-500 hover:text-gray-300 transition-colors">&larr; All Templates</a>
    <h1 class="text-xl font-semibold text-gray-100 mt-2">{{ template.name }}</h1>
    <p class="text-sm text-gray-500 mt-0.5">{{ template.description }}</p>
    <div class="flex items-center gap-3 mt-2">
      <span class="pill pill-info">{{ template.model }}</span>
      <span class="text-2xs text-gray-600 font-mono">{{ template.id }}</span>
    </div>
  </div>

  <form action="/admin/assistant-templates/{{ template.id }}/files" method="post" class="space-y-5" data-toast-submit data-fail="Failed to save files.">
    <div class="card p-5">
      <label class="block text-sm font-medium text-gray-300 mb-2">AGENTS.md</label>
      <textarea name="AGENTS.md" rows="20" class="input font-mono text-xs">{{ template.files.get('AGENTS.md', '') }}</textarea>
    </div>
    <div class="card p-5">
      <label class="block text-sm font-medium text-gray-300 mb-2">SOUL.md</label>
      <textarea name="SOUL.md" rows="12" class="input font-mono text-xs">{{ template.files.get('SOUL.md', '') }}</textarea>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="btn btn-primary">Save Files</button>
    </div>
  </form>
</div>
{% endblock %}
