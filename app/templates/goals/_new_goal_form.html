{% from "partials/_info_popover.html" import info_popover %}
<div class="flex items-center justify-between mb-4">
  <h2 class="text-lg font-semibold text-gray-100">Create Goal</h2>
  <button type="button" onclick="document.getElementById('modal-new-goal').classList.add('hidden')"
    class="text-gray-500 hover:text-gray-300 transition-colors">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>
<form action="/goals" method="post" class="space-y-3" data-toast-submit data-fail="Failed to create goal.">
  <div>
    <label class="block text-sm text-gray-400 mb-1.5">Color</label>
    <input type="color" name="color_tag" value="#6366f1"
           class="h-9 w-20 rounded cursor-pointer bg-transparent border border-border" />
  </div>
  <div class="grid grid-cols-5 gap-3 items-start">
    <div class="col-span-2">
      {# for= must target the actual input, not be left implicit: a <label>
         with no for= implicitly associates with its first "labelable"
         descendant, which here would be the info_popover's <button> (also
         labelable) rather than the input below. That made clicking the
         plain "Goal ID" text - not the icon - fire a synthetic click
         directly on the button: it landed right after the real click had
         already closed the popover via the outside-click handler, so the
         synthetic one reopened it, freshly repositioned. Explicit for=
         fixes both that and the more basic a11y bug of the label not
         actually focusing its field. #}
      <label for="new-goal-id-input" class="block text-sm text-gray-400 mb-1.5 flex items-center gap-1">Goal ID
        {{ info_popover(
          "This becomes the goal's permanent identifier: it's used in URLs and, if you connect Slack, becomes the Slack channel name. Pick something short and recognizable; it can't be changed later."
        ) }}
      </label>
      <input id="new-goal-id-input" name="id" required
             pattern="[A-Z][A-Z0-9]{2,4}"
             minlength="3" maxlength="5"
             class="input"
             style="text-transform: uppercase;"
             placeholder="e.g., AUTH"
             title="3–5 uppercase letters/digits, starts with a letter."
             oninput="this.value = this.value.toUpperCase();" />
      <p class="text-2xs text-gray-600 mt-1">3–5 chars, uppercase, unique.</p>
    </div>
    <div class="col-span-3">
      <label class="block text-sm text-gray-400 mb-1.5">Name</label>
      <input name="name" required class="input" placeholder="e.g., Build Auth Service" />
    </div>
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1.5">Objective</label>
    <textarea name="objective" rows="2" class="input" placeholder="What does success look like? The Goal Orchestrator uses this to plan tasks."></textarea>
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1.5">Description</label>
    <textarea name="description" rows="2" class="input" placeholder="Additional context"></textarea>
  </div>
  <div>
    {# for="go-new-model" targets _go_model_picker.html's first <select> (id
       is "{widget_id}-model", and widget_id is set to "go-new" below) -
       same reasoning as the Goal ID label above: without an explicit for=,
       this label would implicitly bind to the info_popover's button instead. #}
    <label for="go-new-model" class="block text-sm text-gray-400 mb-1.5 flex items-center gap-1">Goal Orchestrator model
      {{ info_popover(
        "The Goal Orchestrator (GO) is the agent that breaks this goal down into stories and tasks for the other agents to work on - one is created automatically per goal. This picks which LLM it runs on."
      ) }}
    </label>
    {% set field_name = "go_model" %}
    {% set picker_current = "" %}
    {% set widget_id = "go-new" %}
    {% include "goals/_go_model_picker.html" %}
    <p class="text-2xs text-gray-500 mt-1">Changeable later from Goal Settings.</p>
  </div>
  <div class="flex justify-end gap-2 pt-1">
    <button type="button" onclick="document.getElementById('modal-new-goal').classList.add('hidden')"
      class="btn btn-secondary">Cancel</button>
    <button type="submit" class="btn btn-primary">Create Goal</button>
  </div>
</form>
