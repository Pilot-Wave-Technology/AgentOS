name: Feature request
description: Propose a new capability or product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Help us evaluate this request with concrete use cases and tradeoffs.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of AgentOS would this affect? (Maps to the branch the change lands on.)
      options:
        - Control plane (agent_os_platform)
        - Agent gateway (agent_os_openclaw)
        - Docs / deployment (main)
        - Not sure / cross-cutting
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line statement of the requested capability.
      placeholder: Add a per-goal daily digest of open approval gates.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user pain this solves and why current behavior is insufficient.
      placeholder: Operators miss pending approval gates because they only surface in Slack threads, which get buried in busy channels.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Desired behavior/API/UX with as much specificity as possible.
      placeholder: A scheduled job that posts a summary of all awaiting_approval tasks per goal, once per day, to the goal's thread.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches considered and why they are weaker.
      placeholder: Relying on Slack's own unread-thread indicators is inconsistent across clients.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: |
        Explain who is affected, severity/urgency, how often this pain occurs, and practical consequences.
        Include:
        - Affected users/goals/agent types
        - Severity (annoying, blocks workflow, etc.)
        - Frequency (always/intermittent/edge case)
        - Consequence (delays, missed approvals, extra manual work, etc.)
      placeholder: |
        Affected: Operators managing goals with 5+ concurrent stories
        Severity: Medium
        Frequency: Daily
        Consequence: Approval gates sit unactioned for hours
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence/examples
      description: Prior art, links, screenshots, logs, or metrics.
      placeholder: Comparable digest features in other approval-workflow tools; screenshot of a buried approval thread.
  - type: textarea
    id: additional_information
    attributes:
      label: Additional information
      description: Extra context, constraints, or references not covered above.
      placeholder: Must not duplicate existing kill-switch or ledger notifications.
