; The suite's shape, declared once.
;
; WHY THIS FILE EXISTS. Until now there was no pytest configuration at
; all, and the suite's real shape -- four roots -- lived only in
; `scripts/ci/run_suite.sh` as a shell variable. So `pytest`, typed from
; the repo root by any newcomer or agent, was not the suite: it walked
; the whole tree, collected 102 harness scripts under `infra/e0/ci/`
; (named `test_*.py`, but standalone programs -- one calls `sys.exit(1)`
; at module scope), and died with fourteen errors and an INTERNALERROR
; before running a single real test. The answer was "you have to know
; the four roots", which is a workaround wearing a fix's clothes.
;
; `testpaths` APPLIES ONLY WHEN NO PATH IS GIVEN, which is exactly the
; case that was broken. `pytest` and `pytest app kernel tests packages`
; are now the same run, and `pytest app/services/tests/test_x.py` still
; does what you asked. CONTRIBUTING.md tells people to run `pytest -q`;
; this is what makes that true.
;
; AND IT PINS rootdir TO THIS DIRECTORY. pytest derives rootdir from the
; arguments when there is no config file, so
; `pytest packages/agentos-ledger-client/tests` used to put rootdir
; inside the package and skip the repo-root conftest -- which is where
; `src` gets onto `sys.path`. That presented as
; `ModuleNotFoundError: No module named 'agentos_ledger_client'`, i.e.
; "the package is broken", rather than "pytest looked in a narrower
; place". An ini file at the root ends that whole class of confusion.
;
; WHAT IS DELIBERATELY NOT COLLECTED, beyond the harness scripts:
; `infra/e0/corpus/` and `agent_os_test_suite/fixtures/` hold FIXTURE
; REPOSITORIES -- small sample projects with their own `tests/`, which
; exist to be run BY the kernel as subject matter. Collecting them into
; our own suite does not merely waste time, it asserts things about
; sample data as though they were our invariants.

[pytest]
testpaths = app kernel tests packages

; THE DISTRIBUTION'S ONE ADDITION. release_deselect.py leaves out the tests
; listed in release_deselect.txt -- each asserts how an internal file this
; distribution does not ship is written. Read the list for the reasons.
addopts = -p release_deselect

; A deadline per test, not per suite. A hung test and a slow one look
; identical while a build is running -- the step produces no output and
; dies on ITS timeout, with the log ending mid-suite and naming nothing.
; `thread` because the default (SIGALRM) does not exist on Windows, and
; a developer reproducing a CI failure must not get different behaviour
; from CI.
timeout = 300
timeout_method = thread

; asyncio_mode is NOT set here on purpose: the suite marks its
; coroutines explicitly with `@pytest.mark.asyncio`, and switching to
; `auto` would silently change which tests run.

markers =
    no_parallel: cannot run under pytest-xdist. Serial runs -- which is
        every CI run -- execute it normally; only `AGENTOS_TEST_WORKERS`
        deselects it. Two shapes earn this mark and neither is a defect
        worth redesigning a working test for: a real child process on a
        fixed TCP port (two workers would collide on the bind), and a
        fixture sharing one asyncpg connection across an ordering
        xdist does not preserve. The full suite still covers them
        because CI never passes -n.
